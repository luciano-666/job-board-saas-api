services:
  db:
    image: postgres:18
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    volumes:
      - app-db-data:/var/lib/postgresql/data/pgdata
    environment:
      - PGDATA=/var/lib/postgresql/data/pgdata
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD?Variable not set}
      - POSTGRES_USER=${POSTGRES_USER?Variable not set}
      - POSTGRES_DB=${POSTGRES_DB?Variable not set}
    ports:
      - "5432:5432"

  redis:
    image: redis:latest
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      retries: 5
      start_period: 10s
      timeout: 5s
    environment:
      - REDIS_ARGS=--requirepass ${REDIS_PASSWORD?Variable not set} --appendonly yes
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"

  adminer:
    image: adminer
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

 # Mailtrap SMTP sandbox — replace MailHog.
  # Requires MAILTRAP_USER and MAILTRAP_PASSWORD from your Mailtrap inbox credentials.
  # Alternatively, point SMTP_HOST/PORT directly at sandbox.smtp.mailtrap.io in .env
  # and skip this service entirely (Mailtrap is cloud-hosted, no local container needed).
  #
  # If you still want a local catch-all for offline dev, use `axllent/mailpit` instead:
  #   image: axllent/mailpit
  #   ports: ["1025:1025", "8025:8025"]
  #
  # mailpit:
  #   image: axllent/mailpit
  #   restart: always
  #   ports:
  #     - "1025:1025"   # SMTP
  #     - "8025:8025"   # Web UI

volumes:
  app-db-data:
  redis-data:
    driver: local
