[project]
name = "job-board-saas-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.4",
    "celery[redis]>=5.3.1",
    "fastapi[standard]>=0.136.3",
    "jwcrypto>=1.5.7",
    "orjson>=3.11.9",
    "psycopg[binary]>=3.3.4",
    "pwdlib[argon2,bcrypt]>=0.3.0",
    "pyjwt>=2.13.0",
    "python-magic>=0.4.27",
    "redis>=8.0.1",
    "sentry-sdk>=2.61.1",
    "sqlalchemy>=2.0.50",
    "structlog>=26.1.0",
]

[tool.fastapi]
entrypoint = "src.main:app"

[tool.pytest.ini_options]
anyio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.15",
]
